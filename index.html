<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>더오를패스 · 자격증 CBT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F2F4F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="더오를패스">
<meta name="description" content="더오를패스 자격증 CBT: 투자자산운용사 등 자격증 문제 풀이, OX 선지 퀴즈, 오답노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F6;--card:#FFFFFF;--text:#191F28;--sub:#4E5968;--gray:#8B95A1;--line:#E5E8EB;--blue:#3182F6;--blue-dark:#1B64DA;--blue-soft:#E8F3FF;--red:#F04452;--red-soft:#FFEEEE;--green:#00C471;--green-soft:#E5F8EF;--orange:#FF8A00;--orange-soft:#FFF3E0;--gold:#B57A00;--gold-soft:#FFF4D6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);letter-spacing:-0.02em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font:inherit}
svg{display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:120px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 20px;height:56px}
.top .back{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;margin-left:-8px}
.top .back:active{background:var(--line)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.top .right{font-size:14px;color:var(--gray);font-weight:600;font-variant-numeric:tabular-nums}
.logo{display:flex;align-items:center;gap:8px;flex:1}
.logo img{width:28px;height:28px;border-radius:8px}
.logo b{font-size:19px;font-weight:800}.logo b em{font-style:normal;color:var(--blue)}
.logo span{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:3px 7px;border-radius:6px}
.pad{padding:0 20px}
.h1{font-size:23px;font-weight:800;line-height:1.4;margin:6px 0 18px}
.h1 em{font-style:normal;color:var(--blue)}
.card{background:var(--card);border-radius:24px;padding:20px;margin-bottom:12px}
.row{display:flex;gap:12px}.row>.card{flex:1}
.lbl{font-size:14px;color:var(--gray);font-weight:600}
.val{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.val small{font-size:14px;color:var(--gray);font-weight:600;margin-left:2px}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800;margin:30px 2px 12px}
.sec a{font-size:14px;color:var(--gray);font-weight:600;cursor:pointer}
.sec .pro{font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FFB800,#FF8A00);padding:4px 8px;border-radius:7px;margin-left:6px;vertical-align:3px}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:24px;padding:16px 18px;margin-bottom:10px;transition:transform .12s}
.menu:active,.tile:active{transform:scale(.97)}
.ico{width:48px;height:48px;flex-shrink:0}
.ico svg{width:100%;height:100%}
.menu .t{font-size:16px;font-weight:700}
.menu .d{font-size:14px;color:var(--gray);margin-top:3px}
.grow{flex:1;min-width:0}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;gap:3px}
.tag.free{background:var(--blue-soft);color:var(--blue)}
.tag.pro{background:var(--gold-soft);color:var(--gold)}
.tag.on{background:var(--green-soft);color:var(--green)}
.chev{color:#C4CAD0;font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--card);border-radius:24px;padding:18px;text-align:left;transition:transform .12s;position:relative;min-height:150px;display:flex;flex-direction:column}
.tile .ico{width:52px;height:52px}
.tile .t{font-size:16px;font-weight:700;margin-top:auto;padding-top:14px}
.tile .d{font-size:13px;color:var(--gray);margin-top:3px}
.tile .tag{position:absolute;top:16px;right:14px}
.tile.locked{background:linear-gradient(180deg,#fff,#FFFBF0)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 15px;border-radius:999px;background:var(--card);font-size:15px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--text);color:#fff}
/* hero */
.hero{background:radial-gradient(120% 90% at 30% 0%,#2A4A8A 0%,#13295A 55%,#0B1A3D 100%);color:#fff;border-radius:26px;padding:22px 22px 18px;margin-bottom:12px;position:relative;overflow:hidden;min-height:176px}
.hero .art{position:absolute;right:-6px;bottom:-4px;width:220px;height:150px}
.hero .k{font-size:14px;opacity:.9;font-weight:600;position:relative}
.hero .dd{font-size:38px;font-weight:800;margin:2px 0 4px;position:relative;letter-spacing:-0.03em;color:#FFD54F}
.hero .m{font-size:14px;opacity:.95;position:relative;max-width:58%;line-height:1.5}
.hero .set{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:700;padding:7px 11px;border-radius:10px;z-index:2;backdrop-filter:blur(4px)}
.hero .bank{position:relative;margin-top:16px;max-width:52%}
.hero .bank .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.28);overflow:hidden}
.hero .bank .tr i{display:block;height:100%;background:linear-gradient(90deg,#FFD54F,#F2A516);border-radius:8px}
.hero .bank .tx{font-size:12px;font-weight:600;opacity:.9;margin-top:6px}
.goal{display:flex;align-items:center;gap:16px}
.ring{width:64px;height:64px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800}
.fl{display:flex;align-items:center;gap:2px;justify-content:flex-end}
.fl svg{width:24px;height:24px}
.streak{display:flex;gap:6px;margin-top:16px}
.streak div{flex:1;text-align:center;font-size:12px;color:var(--gray);font-weight:600}
.streak i{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 5px;border-radius:50%;background:var(--bg)}
.streak i svg{width:20px;height:20px}
.streak i.on{background:var(--orange-soft)}
.streak i.today{box-shadow:0 0 0 2px var(--blue) inset}
.bar{display:flex;align-items:center;gap:10px;margin:13px 0;font-size:15px}
.bar .nm{width:122px;color:var(--sub);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:10px;background:var(--bg);border-radius:10px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--blue);border-radius:10px;transition:width .5s}
.bar .v{width:42px;text-align:right;font-weight:700;font-size:14px}
.weak{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:var(--red-soft);padding:2px 6px;border-radius:6px;margin-left:5px;vertical-align:1px}
.dox .hd{display:flex;align-items:center;gap:8px}
.dox .st{font-size:17px;font-weight:700;line-height:1.5;margin:12px 0 16px;word-break:keep-all}
.dox .bt{display:flex;gap:10px}
.dox .bt button{flex:1;height:58px;border-radius:16px;background:var(--bg);font-size:28px;font-weight:800;transition:transform .1s}
.dox .bt button:active{transform:scale(.97)}
.dox .bt .o{color:var(--blue)}.dox .bt .x{color:var(--red)}
.dox .bt button.hit{box-shadow:0 0 0 2px currentColor inset;background:#fff}
.dox .res{margin-top:14px;font-size:14px;line-height:1.6;padding:14px;border-radius:14px}
.lock{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:14px 16px;border-radius:14px;background:#FFF8E6;font-size:14px;font-weight:700;color:#8A5D00;width:100%}
.gauge{position:relative;height:12px;border-radius:12px;background:var(--bg);margin:14px 0 26px}
.gauge i{display:block;height:100%;border-radius:12px;transition:width .5s}
.gauge .mk{position:absolute;top:-4px;width:2px;height:20px;background:var(--text);border-radius:2px}
.gauge .mk em{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;white-space:nowrap}
.cutline{position:relative}.cutline:after{content:"";position:absolute;left:var(--cut,40%);top:-2px;bottom:-2px;border-left:2px dotted #8B95A1}
.examinfo .eh{display:flex;align-items:center;gap:12px}
.examinfo .eg{display:flex;gap:8px;margin:16px 0 12px}
.examinfo .eg div{flex:1;background:var(--bg);border-radius:14px;padding:12px 0;text-align:center;font-size:13px;color:var(--sub);font-weight:600}
.examinfo .eg b{display:block;font-size:20px;color:var(--text);font-weight:800}
.examinfo .er{font-size:14px;line-height:2;color:var(--sub)}
.examinfo .er span{display:inline-block;font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;margin-right:8px}
.examinfo .er .ok{background:var(--green-soft);color:var(--green)}.examinfo .er .no{background:var(--red-soft);color:var(--red)}
.switch{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 10px 5px 5px;font-size:14px;font-weight:700;color:var(--text)}
.cb{display:inline-grid;place-items:center;border-radius:28%;color:#fff;font-weight:800;letter-spacing:-0.04em;flex-shrink:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.cc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:16px 18px;margin-bottom:10px;border:2px solid transparent;transition:transform .12s}
.cc:active{transform:scale(.98)}.cc.on{border-color:var(--blue)}
.cc .t{font-size:16px;font-weight:700}.cc .d{font-size:13px;color:var(--gray);margin-top:3px}
.cc.soon{opacity:.6}
.allpass{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:22px;padding:18px 20px;background:radial-gradient(120% 120% at 0% 0%,#2A4A8A,#0B1A3D);color:#fff}
.allpass .t{font-size:17px;font-weight:800;color:#FFD54F}.allpass .d{font-size:13px;opacity:.85;margin-top:3px}
.allpass .go{background:#FFD54F;color:#0B1A3D;font-weight:800;font-size:14px;padding:8px 12px;border-radius:10px}
.plan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--bg);margin-bottom:8px;border:2px solid transparent}
.plan.on{border-color:var(--blue);background:var(--blue-soft)}
.plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid #C4CAD0;flex-shrink:0;position:relative;background:#fff}
.plan.on .rd{border-color:var(--blue)}.plan.on .rd:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
.plan .t{font-size:16px;font-weight:800}.plan .d{font-size:13px;color:var(--gray);margin-top:2px}
.plan .pr{font-size:17px;font-weight:800;text-align:right;white-space:nowrap}.plan .pr s{display:block;font-size:12px;color:var(--gray);font-weight:500}
.best{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FFB800,#FF8A00);padding:2px 6px;border-radius:6px;vertical-align:2px;margin-left:4px}
.list .li .ico .cb{border-radius:9px}
.app.wide{max-width:1180px}
.qtop{gap:10px}.qtop .ttl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qnav{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qnav .nv{font-size:14px;font-weight:700;color:var(--sub);padding:8px 10px;border-radius:10px}
.qnav .nv:disabled{color:#C4CAD0}
.qnav .nx{background:var(--blue);color:#fff}
.qnav .pg{font-size:14px;font-weight:700;background:var(--card);padding:8px 12px;border-radius:999px;border:1px solid var(--line)}
.qwrap{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.qwrap{grid-template-columns:1.05fr 1fr;align-items:start}.xcard{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}}
.qcard,.xcard{background:var(--card);border-radius:24px;padding:22px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qhead b{font-size:18px;font-weight:800}
.tagS{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:4px 9px;border-radius:8px}
.tagL{font-size:12px;font-weight:700;color:var(--sub);border:1px solid var(--line);padding:3px 8px;border-radius:8px}
.tagR{font-size:12px;font-weight:700;color:#fff;background:var(--red);padding:4px 8px;border-radius:8px}
.tools{display:flex;gap:6px;margin-bottom:14px}
.tools button{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--sub);background:var(--bg);padding:7px 11px;border-radius:999px}
.tools button svg{width:16px;height:16px}
.tools button.has{background:#FFF4D6;color:#8A5D00}
textarea.memo{width:100%;min-height:70px;border:1px solid #F0D68A;background:#FFFBEA;border-radius:14px;padding:12px;font:inherit;font-size:14px;margin-bottom:14px;resize:vertical;color:var(--text)}
.qcard .qtext{font-size:19px;margin-bottom:18px}
.qcard .opt{background:var(--bg)}
.opt.faded{opacity:.55}
.qact{display:flex;gap:8px;margin-top:14px}
.xp-top{font-size:18px;font-weight:800;margin-bottom:12px}
.xp-wait{text-align:center;color:var(--gray);padding:34px 0;font-size:15px;line-height:1.6}
.xp-wait svg{width:52px;height:52px;margin:0 auto 10px;opacity:.6}
.xp-ans{font-size:15px;line-height:1.55;padding:14px;border-radius:14px;background:var(--bg);margin-bottom:6px}
.xp-ans span{font-weight:800;margin-right:4px}.xp-ans .g{color:var(--green)}.xp-ans .r{color:var(--red)}
.xp-ans b{color:var(--blue)}
.xp-sec{padding:14px 0 4px;border-top:1px solid var(--line);margin-top:10px}
.xp-sec:first-of-type{border-top:0}
.xp-h{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;margin-bottom:6px;border-left:3px solid var(--blue);padding-left:9px}
.xp-h svg{width:20px;height:20px}
.xp-h.xp-x{border-color:var(--red);color:var(--red)}.xp-h.xp-x span{color:var(--text)}
.xp-sec p{font-size:15px;line-height:1.65;color:#333D4B;margin:0}
.xp-w{display:flex;gap:8px;background:var(--bg);border-radius:12px;padding:11px 12px;margin:7px 0;font-size:14px;line-height:1.55;color:#333D4B}
.xp-w b{color:var(--sub);flex-shrink:0}
.xp-w.mine{background:var(--red-soft)}
.xp-w em{display:inline-block;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px;margin-left:6px}
.xp-me{font-size:13px;color:var(--gray);margin-top:12px}
.xcard .ref{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.jump{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:50vh;overflow:auto}
.jump button{height:38px;border-radius:10px;background:var(--bg);font-weight:700;font-size:13px;color:var(--sub)}
.jump .ok{background:var(--green-soft);color:var(--green)}.jump .no{background:var(--red-soft);color:var(--red)}
.jump .cur{box-shadow:0 0 0 2px var(--blue) inset}
.witem .a.xa{background:transparent;padding:6px 0 0}
.qtop .ttl small{display:block;font-size:12px;color:var(--gray);font-weight:600;margin-top:1px}
.qnav .ar{width:36px;height:36px;border-radius:12px;background:var(--card);font-size:22px;font-weight:700;color:var(--text);line-height:1}
.qnav .ar:disabled{color:#D1D6DB}
.qnav .pg{display:flex;align-items:center;gap:6px;color:var(--text)}.qnav .pg em{font-style:normal;color:var(--gray);font-weight:600}
.qno{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:#13295A;color:#FFD54F;font-weight:800;font-size:15px}
.qhead .tools{margin:0 0 0 auto;gap:4px}
.qhead .tools button{width:34px;height:34px;padding:0;justify-content:center;border-radius:10px}
.rx-band{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--bg);margin-bottom:6px}
.rx-band.ok{background:linear-gradient(135deg,#E5F8EF,#F3FCF7)}.rx-band.no{background:linear-gradient(135deg,#FFF3E0,#FFF9F0)}
.rx-ic{width:46px;height:46px;flex-shrink:0}.rx-ic svg{width:100%;height:100%}
.rx-t{font-size:17px;font-weight:800}.rx-band.ok .rx-t{color:var(--green)}.rx-band.no .rx-t{color:#E07000}
.rx-s{font-size:14px;color:var(--sub);margin-top:2px;line-height:1.45}
.rx-blk{padding:14px 2px 4px}
.rx-lbl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:6px}
.rx-lbl i{font-style:normal;font-size:11px;font-weight:800;color:#FFD54F;background:#13295A;border-radius:6px;padding:2px 6px}
.rx-blk p{font-size:15px;line-height:1.65;color:#333D4B;margin:0}
.rx-tb{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px;line-height:1.5;color:#333D4B}
.rx-tb td{padding:9px 8px;background:var(--bg);vertical-align:top}
.rx-tb td:first-child{border-radius:10px 0 0 10px;width:22px;color:var(--sub);font-weight:700}
.rx-tb td:last-child{border-radius:0 10px 10px 0}
.rx-tb td.j{width:22px}.rx-tb b.o{color:var(--green)}.rx-tb b.x{color:var(--red)}
.rx-tb tr.c td{background:var(--green-soft)}.rx-tb tr.m td{background:#FFF3E0}
.rx-tb .pk{font-size:11px;font-weight:800;color:#fff;background:#E07000;border-radius:6px;padding:1px 6px;white-space:nowrap}
.sheet{visibility:hidden}.sheet.show{visibility:visible}
.ftop .back-x{font-size:14px;font-weight:700;color:var(--sub);background:var(--card);padding:8px 12px;border-radius:999px}
.fwrap{display:grid;gap:16px}
@media(min-width:900px){.fwrap{grid-template-columns:420px 1fr;gap:28px;align-items:start;padding-top:8px}.fhero{position:sticky!important;top:64px}.flist .fl-h:first-child{margin-top:0}}
.fhero{position:relative;overflow:hidden;border-radius:28px;padding:26px 24px 22px;color:#fff;background:radial-gradient(120% 90% at 20% 0%,#2A4A8A 0%,#13295A 55%,#0B1A3D 100%)}
.fhero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.5px);background-size:22px 22px;opacity:.25;pointer-events:none}
.fh-art{position:absolute;right:-18px;top:-10px;width:150px;height:150px;transform:rotate(10deg);opacity:.95}
.fh-art img{width:100%;height:100%;border-radius:34px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.fh-k{position:relative;font-size:13px;font-weight:700;color:#9EC5FF}
.fhero h1{position:relative;font-size:28px;line-height:1.3;margin:8px 0 8px;font-weight:800;letter-spacing:-.03em}
.fhero h1 em{font-style:normal;color:#FFD54F}
.fhero p{position:relative;font-size:15px;opacity:.85;margin:0 0 18px;max-width:240px;line-height:1.5}
.fh-stats{position:relative;display:flex;gap:8px;margin-bottom:16px}
.fh-stats div{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 0;text-align:center}
.fh-stats b{display:block;font-size:20px;font-weight:800;color:#FFD54F}
.fh-stats span{font-size:12px;opacity:.8}
.fh-pt{position:relative;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fh-pt li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.fh-pt li svg{width:26px;height:26px;flex-shrink:0}

const pad2 = n => String(n).padStart(2, '0');

function streakOf(days) { let n = 0, d = new Date(); if (!days[dkey(d)]) d.setDate(d.getDate() - 1); while (days[dkey(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }

function goQ(i) { run.i = Math.max(0, Math.min(run.items.length - 1, i)); run.memo = false; drawQ(); }

  </div>`;
  bottom(`<button class="btn ghost sm" ${r.i === 0 ? 'disabled' : ''} onclick="run.i--;drawMock()">이전</button>` + (r.i + 1 < r.items.length ? `<button class="btn ghost" onclick="run.i++;drawMock()">다음</button>` : '') + `<button class="btn" onclick="submitMock()">제출하기</button>`); }
let submitArm = false;

/* ===== 결과 ===== */

  </div>`; tabbar(); }
let resetArm = false;
function resetAll() { if (!resetArm) { resetArm = true; toast('한 번 더 누르면 ' + C.short + ' 기록이 초기화돼요'); setTimeout(() => resetArm = false, 2500); return; } G.data[C.id] = blankCert(); useCert(C.id); save(); resetArm = false; toast('기록을 초기화했어요'); go('home'); }

/* ===== 시트 ===== */
function openSheet(html) { const sh = document.getElementById('sheet'); sh.innerHTML = '<div class="grab"></div>' + html; document.getElementById('dim').classList.add('show'); sh.classList.add('show'); }
function closeSheet() { document.getElementById('dim').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }
document.getElementById('dim').onclick = closeSheet;
function examSheet() { openSheet(`<div class="hi">${IC.calendar()}</div><h3>${esc(C.short)} 시험일이 언제예요?</h3><div class="p">D-day와 하루에 풀 문제 수를 계산해 드려요</div>
  <input class="field" type="date" id="exam" value="${S.exam}" min="${dkey()}"><button class="btn" style="width:100%" onclick="S.exam=document.getElementById('exam').value;save();closeSheet();go(tab)">저장하기</button>`); }
function goalSheet() { openSheet(`<div class="hi">${IC.goal()}</div><h3>하루에 몇 문제 풀까요?</h3><div class="p">부담 없는 목표가 오래 가요</div>
  <div class="goals">${[5, 10, 20, 30].map(n => `<button class="${S.goal === n ? 'on' : ''}" onclick="S.goal=${n};save();closeSheet();go(tab)">${n}문제</button>`).join('')}</div>`); }
function nameSheet() { openSheet(`<h3>뭐라고 불러 드릴까요?</h3><div class="p">홈 화면 인사말에 표시돼요</div>
  <input class="field" id="nm" maxlength="10" placeholder="이름 또는 닉네임" value="${esc(G.name)}"><button class="btn" style="width:100%" onclick="G.name=document.getElementById('nm').value.trim();save();closeSheet();go(tab)">저장하기</button>`); }

/* ===== 홈 화면에 추가 ===== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('appinstalled', () => { G.installHidden = true; save(); toast('홈 화면에 추가됐어요'); });
function isStandalone() { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
function showInstall() { return !isStandalone() && !G.installHidden; }
function installGuide() { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; }); return; }
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document), inApp = /Instagram|FBAN|FBAV|KAKAOTALK|NAVER/.test(ua);
  const step = (n, t) => `<div class="feat"><span class="ck">${n}</span><span>${t}</span></div>`; let body;
  if (inApp) body = step(1, '오른쪽 위 <b>⋯ 메뉴</b>를 눌러요') + step(2, '<b>다른 브라우저로 열기</b>를 눌러요 (아이폰은 Safari, 안드로이드는 Chrome)') + step(3, '열린 화면에서 이 버튼을 한 번 더 눌러요');
  else if (ios) body = step(1, 'Safari 아래쪽 <b>공유 버튼(□↑)</b>을 눌러요') + step(2, '목록을 내려서 <b>홈 화면에 추가</b>를 눌러요') + step(3, '오른쪽 위 <b>추가</b>를 누르면 끝!');
  else body = step(1, 'Chrome 오른쪽 위 <b>⋮ 메뉴</b>를 눌러요') + step(2, '<b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 눌러요') + step(3, '<b>설치</b>를 누르면 끝!');
  openSheet(`<div class="hi"><img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px;box-shadow:0 6px 16px rgba(11,26,61,.3)" onerror="this.remove()"></div><h3>홈 화면에 추가하면<br>앱처럼 바로 열려요</h3><div class="p">${inApp ? '인스타·카톡 안에서는 추가가 안 돼서, 브라우저로 먼저 열어야 해요' : '링크 찾을 필요 없이 아이콘 한 번으로 문제 풀기'}</div>${body}<div style="height:14px"></div><button class="btn" style="width:100%" onclick="closeSheet()">알겠어요</button>`); }

/* ===== 결제: 자격증별 PRO + 통합 패스 ===== */
let payPick = 'all';
function paywall(kind) { afterPay = kind; payPick = kind === 'all' ? 'all' : (G.passCerts.includes(C.id) ? 'all' : 'one'); drawPay(); }
function drawPay() { const one = kind => `<button class="plan ${payPick === kind ? 'on' : ''}" onclick="payPick='${kind}';drawPay()">`;
  openSheet(`<h3>틀린 문제만 골라서<br>자격증 합격까지 빠르게</h3><div class="p">더오를패스 PRO로 합격선까지 약점을 집중 복습하세요</div>
    <div class="feat"><span class="fi">${IC.note()}</span><span>오답노트 자동 정리<small>틀린 문제만 다시 풀고, 맞히면 빠져요</small></span></div>
    <div class="feat"><span class="fi">${IC.ox()}</span><span>OX 선지 퀴즈<small>선지를 쪼개서 개념을 확실하게</small></span></div>
    <div class="feat"><span class="fi">${IC.target()}</span><span>약점 과목 집중 · 별표 문제<small>정답률 낮은 과목부터 자동으로</small></span></div>
    <div style="height:10px"></div>
    ${G.passCerts.includes(C.id) ? '' : `${one('one')}<span class="rd"></span><div class="grow"><div class="t">${esc(C.short)} PRO</div><div class="d">${esc(C.name)} 시험일까지</div></div><div class="pr">${won(C.price)}</div></button>`}
    ${one('all')}<span class="rd"></span><div class="grow"><div class="t">더오를패스 ALL <span class="best">추천</span></div><div class="d">모든 자격증 PRO · 새 자격증도 자동 포함</div></div><div class="pr"><s>${won(ALL_LIST)}</s>${won(ALL_PRICE)}</div></button>
    <button class="btn" style="width:100%;margin-top:6px" onclick="buy()">${payPick === 'all' ? won(ALL_PRICE) : won(C.price)} 결제하기</button>
    <div class="note">시제품이라 실제 결제는 되지 않고 바로 잠금이 풀려요</div>`); }
function buy() { if (payPick === 'all') G.passAll = true; else if (!G.passCerts.includes(C.id)) G.passCerts.push(C.id); save(); closeSheet(); toast((payPick === 'all' ? '더오를패스 ALL' : C.short + ' PRO') + '가 열렸어요 🎉');
  setTimeout(() => { if (afterPay === 'ox') startOx(0); else if (afterPay === 'weak') startWeak(); else if (afterPay === 'all') go(tab); else { tab = 'note'; go('note'); } }, 300); }

/* ===== 시작 ===== */
if (!READY.length) { document.getElementById('app').innerHTML = '<div class="empty">자격증 데이터가 없어요</div>'; }
else if (!G.cur || !READY.some(c => c.id === G.cur)) { useCert(READY[0].id); G.cur = ''; certPicker(true); }
else { useCert(G.cur); go('home'); }

/* ===== 앱 저장(서비스 워커): 내 주소(https)에 올렸을 때만 동작 ===== */
try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

</script>
</body>
</html>
