<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>더오를패스 · 자격증 CBT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F2F4F6">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="더오를패스">
<meta name="description" content="더오를패스 자격증 CBT: 투자자산운용사 등 자격증 문제 풀이, OX 선지 퀴즈, 오답노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F6;--card:#FFFFFF;--text:#191F28;--sub:#4E5968;--gray:#8B95A1;--line:#E5E8EB;--blue:#3182F6;--blue-dark:#1B64DA;--blue-soft:#E8F3FF;--red:#F04452;--red-soft:#FFEEEE;--green:#00C471;--green-soft:#E5F8EF;--orange:#FF8A00;--orange-soft:#FFF3E0;--gold:#B57A00;--gold-soft:#FFF4D6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);letter-spacing:-0.02em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font:inherit}
svg{display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:120px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 20px;height:56px}
.top .back{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;margin-left:-8px}
.top .back:active{background:var(--line)}
.top .ttl{font-size:17px;font-weight:700;flex:1}
.top .right{font-size:14px;color:var(--gray);font-weight:600;font-variant-numeric:tabular-nums}
.logo{display:flex;align-items:center;gap:8px;flex:1}
.logo img{width:28px;height:28px;border-radius:8px}
.logo b{font-size:19px;font-weight:800}.logo b em{font-style:normal;color:var(--blue)}
.logo span{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:3px 7px;border-radius:6px}
.pad{padding:0 20px}
.h1{font-size:23px;font-weight:800;line-height:1.4;margin:6px 0 18px}
.h1 em{font-style:normal;color:var(--blue)}
.card{background:var(--card);border-radius:24px;padding:20px;margin-bottom:12px}
.row{display:flex;gap:12px}.row>.card{flex:1}
.lbl{font-size:14px;color:var(--gray);font-weight:600}
.val{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.val small{font-size:14px;color:var(--gray);font-weight:600;margin-left:2px}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800;margin:30px 2px 12px}
.sec a{font-size:14px;color:var(--gray);font-weight:600;cursor:pointer}
.sec .pro{font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FFB800,#FF8A00);padding:4px 8px;border-radius:7px;margin-left:6px;vertical-align:3px}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:24px;padding:16px 18px;margin-bottom:10px;transition:transform .12s}
.menu:active,.tile:active{transform:scale(.97)}
.ico{width:48px;height:48px;flex-shrink:0}
.ico svg{width:100%;height:100%}
.menu .t{font-size:16px;font-weight:700}
.menu .d{font-size:14px;color:var(--gray);margin-top:3px}
.grow{flex:1;min-width:0}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;gap:3px}
.tag.free{background:var(--blue-soft);color:var(--blue)}
.tag.pro{background:var(--gold-soft);color:var(--gold)}
.tag.on{background:var(--green-soft);color:var(--green)}
.chev{color:#C4CAD0;font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--card);border-radius:24px;padding:18px;text-align:left;transition:transform .12s;position:relative;min-height:150px;display:flex;flex-direction:column}
.tile .ico{width:52px;height:52px}
.tile .t{font-size:16px;font-weight:700;margin-top:auto;padding-top:14px}
.tile .d{font-size:13px;color:var(--gray);margin-top:3px}
.tile .tag{position:absolute;top:16px;right:14px}
.tile.locked{background:linear-gradient(180deg,#fff,#FFFBF0)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 15px;border-radius:999px;background:var(--card);font-size:15px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--text);color:#fff}
/* hero */
.hero{background:radial-gradient(120% 90% at 30% 0%,#2A4A8A 0%,#13295A 55%,#0B1A3D 100%);color:#fff;border-radius:26px;padding:22px 22px 18px;margin-bottom:12px;position:relative;overflow:hidden;min-height:176px}
.hero .art{position:absolute;right:-6px;bottom:-4px;width:220px;height:150px}
.hero .k{font-size:14px;opacity:.9;font-weight:600;position:relative}
.hero .dd{font-size:38px;font-weight:800;margin:2px 0 4px;position:relative;letter-spacing:-0.03em;color:#FFD54F}
.hero .m{font-size:14px;opacity:.95;position:relative;max-width:58%;line-height:1.5}
.hero .set{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:700;padding:7px 11px;border-radius:10px;z-index:2;backdrop-filter:blur(4px)}
.hero .bank{position:relative;margin-top:16px;max-width:52%}
.hero .bank .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.28);overflow:hidden}
.hero .bank .tr i{display:block;height:100%;background:linear-gradient(90deg,#FFD54F,#F2A516);border-radius:8px}
.hero .bank .tx{font-size:12px;font-weight:600;opacity:.9;margin-top:6px}
.goal{display:flex;align-items:center;gap:16px}
.ring{width:64px;height:64px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800}
.fl{display:flex;align-items:center;gap:2px;justify-content:flex-end}
.fl svg{width:24px;height:24px}
.streak{display:flex;gap:6px;margin-top:16px}
.streak div{flex:1;text-align:center;font-size:12px;color:var(--gray);font-weight:600}
.streak i{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 5px;border-radius:50%;background:var(--bg)}
.streak i svg{width:20px;height:20px}
.streak i.on{background:var(--orange-soft)}
.streak i.today{box-shadow:0 0 0 2px var(--blue) inset}
.bar{display:flex;align-items:center;gap:10px;margin:13px 0;font-size:15px}
.bar .nm{width:122px;color:var(--sub);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:10px;background:var(--bg);border-radius:10px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--blue);border-radius:10px;transition:width .5s}
.bar .v{width:42px;text-align:right;font-weight:700;font-size:14px}
.weak{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:var(--red-soft);padding:2px 6px;border-radius:6px;margin-left:5px;vertical-align:1px}
.dox .hd{display:flex;align-items:center;gap:8px}
.dox .dst{font-size:17px;font-weight:700;line-height:1.5;margin:12px 0 16px;word-break:keep-all}
.dox .bt{display:flex;gap:10px}
.dox .bt button{flex:1;height:58px;border-radius:16px;background:var(--bg);font-size:28px;font-weight:800;transition:transform .1s}
.dox .bt button:active{transform:scale(.97)}
.dox .bt .o{color:var(--blue)}.dox .bt .x{color:var(--red)}
.dox .bt button.hit{box-shadow:0 0 0 2px currentColor inset;background:#fff}
.dox .res{margin-top:14px;font-size:14px;line-height:1.6;padding:14px;border-radius:14px}
.lock{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:14px 16px;border-radius:14px;background:#FFF8E6;font-size:14px;font-weight:700;color:#8A5D00;width:100%}
.gauge{position:relative;height:12px;border-radius:12px;background:var(--bg);margin:14px 0 26px}
.gauge i{display:block;height:100%;border-radius:12px;transition:width .5s}
.gauge .mk{position:absolute;top:-4px;width:2px;height:20px;background:var(--text);border-radius:2px}
.gauge .mk em{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;white-space:nowrap}
.cutline{position:relative}.cutline:after{content:"";position:absolute;left:var(--cut,40%);top:-2px;bottom:-2px;border-left:2px dotted #8B95A1}
.examinfo .eh{display:flex;align-items:center;gap:12px}
.examinfo .eg{display:flex;gap:8px;margin:16px 0 12px}
.examinfo .eg div{flex:1;background:var(--bg);border-radius:14px;padding:12px 0;text-align:center;font-size:13px;color:var(--sub);font-weight:600}
.examinfo .eg b{display:block;font-size:20px;color:var(--text);font-weight:800}
.examinfo .er{font-size:14px;line-height:2;color:var(--sub)}
.examinfo .er span{display:inline-block;font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;margin-right:8px}
.examinfo .er .ok{background:var(--green-soft);color:var(--green)}.examinfo .er .no{background:var(--red-soft);color:var(--red)}
.switch{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 10px 5px 5px;font-size:14px;font-weight:700;color:var(--text)}
.cb{display:inline-grid;place-items:center;border-radius:28%;color:#fff;font-weight:800;letter-spacing:-0.04em;flex-shrink:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.cc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:16px 18px;margin-bottom:10px;border:2px solid transparent;transition:transform .12s}
.cc:active{transform:scale(.98)}.cc.on{border-color:var(--blue)}
.cc .t{font-size:16px;font-weight:700}.cc .d{font-size:13px;color:var(--gray);margin-top:3px}
.cc.soon{opacity:.6}
.allpass{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:22px;padding:18px 20px;background:radial-gradient(120% 120% at 0% 0%,#2A4A8A,#0B1A3D);color:#fff}
.allpass .t{font-size:17px;font-weight:800;color:#FFD54F}.allpass .d{font-size:13px;opacity:.85;margin-top:3px}
.allpass .go{background:#FFD54F;color:#0B1A3D;font-weight:800;font-size:14px;padding:8px 12px;border-radius:10px}
.plan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--bg);margin-bottom:8px;border:2px solid transparent}
.plan.on{border-color:var(--blue);background:var(--blue-soft)}
.plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid #C4CAD0;flex-shrink:0;position:relative;background:#fff}
.plan.on .rd{border-color:var(--blue)}.plan.on .rd:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
.plan .t{font-size:16px;font-weight:800}.plan .d{font-size:13px;color:var(--gray);margin-top:2px}
.plan .pr{font-size:17px;font-weight:800;text-align:right;white-space:nowrap}.plan .pr s{display:block;font-size:12px;color:var(--gray);font-weight:500}
.best{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FFB800,#FF8A00);padding:2px 6px;border-radius:6px;vertical-align:2px;margin-left:4px}
.list .li .ico .cb{border-radius:9px}
.app.wide{max-width:1180px}
.qtop{gap:10px}.qtop .ttl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qnav{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qnav .nv{font-size:14px;font-weight:700;color:var(--sub);padding:8px 10px;border-radius:10px}
.qnav .nv:disabled{color:#C4CAD0}
.qnav .nx{background:var(--blue);color:#fff}
.qnav .pg{font-size:14px;font-weight:700;background:var(--card);padding:8px 12px;border-radius:999px;border:1px solid var(--line)}
.qwrap{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.qwrap{grid-template-columns:1.05fr 1fr;align-items:start}.xcard{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}}
.qcard,.xcard{background:var(--card);border-radius:24px;padding:22px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qhead b{font-size:18px;font-weight:800}
.tagS{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:4px 9px;border-radius:8px}
.tagL{font-size:12px;font-weight:700;color:var(--sub);border:1px solid var(--line);padding:3px 8px;border-radius:8px}
.tagR{font-size:12px;font-weight:700;color:#fff;background:var(--red);padding:4px 8px;border-radius:8px}
.tools{display:flex;gap:6px;margin-bottom:14px}
.tools button{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--sub);background:var(--bg);padding:7px 11px;border-radius:999px}
.tools button svg{width:16px;height:16px}
.tools button.has{background:#FFF4D6;color:#8A5D00}
textarea.memo{width:100%;min-height:70px;border:1px solid #F0D68A;background:#FFFBEA;border-radius:14px;padding:12px;font:inherit;font-size:14px;margin-bottom:14px;resize:vertical;color:var(--text)}
.qcard .qtext{font-size:19px;margin-bottom:18px}
.qcard .opt{background:var(--bg)}
.opt.faded{opacity:.55}
.qact{display:flex;gap:8px;margin-top:14px}
.xp-top{font-size:18px;font-weight:800;margin-bottom:12px}
.xp-wait{text-align:center;color:var(--gray);padding:34px 0;font-size:15px;line-height:1.6}
.xp-wait svg{width:52px;height:52px;margin:0 auto 10px;opacity:.6}
.xp-ans{font-size:15px;line-height:1.55;padding:14px;border-radius:14px;background:var(--bg);margin-bottom:6px}
.xp-ans span{font-weight:800;margin-right:4px}.xp-ans .g{color:var(--green)}.xp-ans .r{color:var(--red)}
.xp-ans b{color:var(--blue)}
.xp-sec{padding:14px 0 4px;border-top:1px solid var(--line);margin-top:10px}
.xp-sec:first-of-type{border-top:0}
.xp-h{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;margin-bottom:6px;border-left:3px solid var(--blue);padding-left:9px}
.xp-h svg{width:20px;height:20px}
.xp-h.xp-x{border-color:var(--red);color:var(--red)}.xp-h.xp-x span{color:var(--text)}
.xp-sec p{font-size:15px;line-height:1.65;color:#333D4B;margin:0}
.xp-w{display:flex;gap:8px;background:var(--bg);border-radius:12px;padding:11px 12px;margin:7px 0;font-size:14px;line-height:1.55;color:#333D4B}
.xp-w b{color:var(--sub);flex-shrink:0}
.xp-w.mine{background:var(--red-soft)}
.xp-w em{display:inline-block;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px;margin-left:6px}
.xp-me{font-size:13px;color:var(--gray);margin-top:12px}
.xcard .ref{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.jump{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:50vh;overflow:auto}
.jump button{height:38px;border-radius:10px;background:var(--bg);font-weight:700;font-size:13px;color:var(--sub)}
.jump .ok{background:var(--green-soft);color:var(--green)}.jump .no{background:var(--red-soft);color:var(--red)}
.jump .cur{box-shadow:0 0 0 2px var(--blue) inset}
.witem .a.xa{background:transparent;padding:6px 0 0}
.qtop .ttl small{display:block;font-size:12px;color:var(--gray);font-weight:600;margin-top:1px}
.qnav .ar{width:36px;height:36px;border-radius:12px;background:var(--card);font-size:22px;font-weight:700;color:var(--text);line-height:1}
.qnav .ar:disabled{color:#D1D6DB}
.qnav .pg{display:flex;align-items:center;gap:6px;color:var(--text)}.qnav .pg em{font-style:normal;color:var(--gray);font-weight:600}
.qno{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:#13295A;color:#FFD54F;font-weight:800;font-size:15px}
.qhead .tools{margin:0 0 0 auto;gap:4px}
.qhead .tools button{width:34px;height:34px;padding:0;justify-content:center;border-radius:10px}
.rx-band{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--bg);margin-bottom:6px}
.rx-band.ok{background:linear-gradient(135deg,#E5F8EF,#F3FCF7)}.rx-band.no{background:linear-gradient(135deg,#FFF3E0,#FFF9F0)}
.rx-ic{width:46px;height:46px;flex-shrink:0}.rx-ic svg{width:100%;height:100%}
.rx-t{font-size:17px;font-weight:800}.rx-band.ok .rx-t{color:var(--green)}.rx-band.no .rx-t{color:#E07000}
.rx-s{font-size:14px;color:var(--sub);margin-top:2px;line-height:1.45}
.rx-blk{padding:14px 2px 4px}
.rx-lbl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:6px}
.rx-lbl i{font-style:normal;font-size:11px;font-weight:800;color:#FFD54F;background:#13295A;border-radius:6px;padding:2px 6px}
.rx-blk p{font-size:15px;line-height:1.65;color:#333D4B;margin:0}
.rx-tb{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px;line-height:1.5;color:#333D4B}
.rx-tb td{padding:9px 8px;background:var(--bg);vertical-align:top}
.rx-tb td:first-child{border-radius:10px 0 0 10px;width:22px;color:var(--sub);font-weight:700}
.rx-tb td:last-child{border-radius:0 10px 10px 0}
.rx-tb td.j{width:22px}.rx-tb b.o{color:var(--green)}.rx-tb b.x{color:var(--red)}
.rx-tb tr.c td{background:var(--green-soft)}.rx-tb tr.m td{background:#FFF3E0}
.rx-tb .pk{font-size:11px;font-weight:800;color:#fff;background:#E07000;border-radius:6px;padding:1px 6px;white-space:nowrap}
.sheet{visibility:hidden}.sheet.show{visibility:visible}
.ftop .back-x{font-size:14px;font-weight:700;color:var(--sub);background:var(--card);padding:8px 12px;border-radius:999px}
.fwrap{display:grid;gap:16px}
@media(min-width:900px){.fwrap{grid-template-columns:420px 1fr;gap:28px;align-items:start;padding-top:8px}.fhero{position:sticky!important;top:64px}.flist .fl-h:first-child{margin-top:0}}
.fhero{position:relative;overflow:hidden;border-radius:28px;padding:26px 24px 22px;color:#fff;background:radial-gradient(120% 90% at 20% 0%,#2A4A8A 0%,#13295A 55%,#0B1A3D 100%)}
.fhero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.5px);background-size:22px 22px;opacity:.25;pointer-events:none}
.fh-art{position:absolute;right:-18px;top:-10px;width:150px;height:150px;transform:rotate(10deg);opacity:.95}
.fh-art img{width:100%;height:100%;border-radius:34px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.fh-k{position:relative;font-size:13px;font-weight:700;color:#9EC5FF}
.fhero h1{position:relative;font-size:28px;line-height:1.3;margin:8px 0 8px;font-weight:800;letter-spacing:-.03em}
.fhero h1 em{font-style:normal;color:#FFD54F}
.fhero p{position:relative;font-size:15px;opacity:.85;margin:0 0 18px;max-width:240px;line-height:1.5}
.fh-stats{position:relative;display:flex;gap:8px;margin-bottom:16px}
.fh-stats div{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 0;text-align:center}
.fh-stats b{display:block;font-size:20px;font-weight:800;color:#FFD54F}
.fh-stats span{font-size:12px;opacity:.8}

.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--text)}
.oxcard{background:var(--card);border-radius:26px;padding:32px 24px;min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:20px;font-weight:700;line-height:1.55;word-break:keep-all;margin-bottom:18px}
.oxcard .s{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:14px}
.oxbtns{display:flex;gap:12px}
.ox{flex:1;height:110px;border-radius:24px;background:var(--card);font-size:52px;font-weight:800;transition:transform .1s}
.ox:active{transform:scale(.96)}
.ox.o{color:var(--blue)}.ox.x{color:var(--red)}
.ox.hit{box-shadow:0 0 0 3px currentColor inset}
.score{text-align:center;padding:28px 22px}
.score .emo{width:84px;height:84px;margin:0 auto}
.score .emo svg{width:100%;height:100%}
.score .big{font-size:44px;font-weight:800;margin-top:6px}
.score .big small{font-size:20px;color:var(--gray);font-weight:600}
.score .msg{font-size:16px;color:var(--sub);margin-top:8px}
.pill{display:inline-block;margin-top:14px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
.pill.pass{background:var(--green-soft);color:var(--green)}.pill.fail{background:var(--red-soft);color:var(--red)}
.upsell{background:linear-gradient(135deg,#1B64DA,#3D8BFA);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px;width:100%;text-align:left;display:block;position:relative;overflow:hidden}
.upsell .t{font-size:18px;font-weight:800;line-height:1.4;position:relative}
.upsell .d{font-size:14px;opacity:.88;margin-top:6px;position:relative;max-width:75%}
.upsell .go{display:inline-flex;align-items:center;gap:4px;margin-top:14px;background:#fff;color:var(--blue);font-weight:800;padding:10px 16px;border-radius:12px;font-size:15px;position:relative}
.upsell .deco{position:absolute;right:-6px;bottom:-8px;width:96px;height:96px;opacity:.95;transform:rotate(-8deg)}
.witem{background:var(--card);border-radius:18px;padding:18px;margin-bottom:10px;cursor:pointer}
.witem .m{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.witem .q{font-size:15px;font-weight:600;line-height:1.5;white-space:pre-line}
.witem .a{font-size:14px;color:var(--sub);margin-top:10px;line-height:1.55;background:var(--bg);border-radius:12px;padding:12px;display:none}
.witem.open .a{display:block}
.hist{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}
.hist .t{font-size:15px;font-weight:600}.hist .d{font-size:13px;color:var(--gray);margin-top:2px}
.hist .s{font-size:17px;font-weight:800}
.empty{text-align:center;padding:44px 20px;color:var(--gray);line-height:1.6}
.empty .e{width:64px;height:64px;margin:0 auto 12px}
.list .li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.list .li:last-child{border:0}
.list .li .ico{width:32px;height:32px}
.list .li .r{margin-left:auto;color:var(--gray);font-size:14px;font-weight:600}
.prof{display:flex;align-items:center;gap:14px}
.prof .av{width:56px;height:56px}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:14px 22px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 18px}
.sheet h3{font-size:22px;font-weight:800;line-height:1.4}
.sheet .p{font-size:15px;color:var(--sub);margin:8px 0 18px}
.sheet .hi{width:72px;height:72px;margin-bottom:12px}
.feat{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:16px;font-weight:600}
.feat .fi{width:36px;height:36px;flex-shrink:0}
.feat .ck{width:24px;height:24px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.feat small{display:block;font-size:13px;color:var(--gray);font-weight:500;margin-top:2px}
.feat b{color:var(--text)}
.price{display:flex;align-items:baseline;justify-content:space-between;background:var(--bg);border-radius:16px;padding:16px 18px;margin:16px 0}
.price .l{font-size:15px;color:var(--sub);font-weight:600}
.price .r{font-size:22px;font-weight:800}
.price .r s{font-size:14px;color:var(--gray);font-weight:500;margin-right:6px}
.note{font-size:12px;color:var(--gray);text-align:center;margin-top:12px}
.field{width:100%;height:54px;border-radius:14px;border:0;background:var(--bg);padding:0 16px;font-size:17px;font-weight:600;color:var(--text);margin-bottom:12px}
.goals{display:flex;gap:8px;margin-bottom:8px}
.goals button{flex:1;height:48px;border-radius:14px;background:var(--bg);font-weight:700}
.goals button.on{background:var(--blue);color:#fff}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:16px;background:var(--bg);margin-bottom:8px;text-align:left}
.pick .t{font-weight:700;font-size:16px}.pick .d{font-size:13px;color:var(--gray);margin-top:2px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(25,31,40,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;transition:all .25s;z-index:30;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{text-align:center;font-size:12px;color:var(--gray);margin:24px 0 0;line-height:1.7}
.install{background:linear-gradient(135deg,#EAF3FF,#F4F9FF)!important}
.install .t{color:var(--blue-dark)}
.install .x{color:var(--gray);font-size:14px;padding:6px;margin:-6px}
.install img{width:48px;height:48px;border-radius:13px;box-shadow:0 4px 10px rgba(11,26,61,.3)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
</style>
</head>

  if (!glyph) return `<span class="cb" style="width:${size}px;height:${size}px;background:${c.color};font-size:${size * .3}px">${c.short}</span>`;
  return `<span class="cicon" style="width:${size}px;height:${size}px;color:${shade(c.color, -.35)}"><svg viewBox="0 0 48 48" width="${size}" height="${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(c.color, .25)}"/><stop offset="1" stop-color="${shade(c.color, -.22)}"/></linearGradient><radialGradient id="${id}h" cx=".25" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="48" height="48" rx="14" fill="url(#${id})"/><rect width="48" height="48" rx="14" fill="url(#${id}h)"/>${glyph}</svg></span>`;
}

.73 392.47 74.13 389.34 74.13C385.88 74.13 383.58 72.54 383.41 69.42H376.12C376.25 76.82 381.41 80.42 389.42 80.42Z M421.99 80.42C429.92 80.42 434.64 76.79 434.64 70.71C434.64 65.60 431.05 62.51 424.87 61.15L422.10 60.51C419.24 59.86 417.37 58.92 417.37 56.94C417.37 55.16 418.94 53.85 421.97 53.85C425.02 53.85 426.72 55.20 426.93 57.52H434.21C434.13 51.59 429.40 47.55 421.99 47.55C414.73 47.55 409.53 51.53 409.53 57.46C409.53 62.27 412.88 65.04 418.40 66.31L421.80 67.10C425.30 67.90 426.97 68.87 426.97 70.69C426.97 72.73 425.04 74.13 421.90 74.13C418.44 74.13 416.14 72.54 415.97 69.42H408.69C408.82 76.82 413.97 80.42 421.99 80.42Z" fill="#0E1B3D"/></svg>`;

<!-- 새 자격증은 여기에 한 줄 추가: <script src="certs/○○.js"></script> -->
<script>
/* ===== 자격증 레지스트리 ===== */
const READY = window.CERTS || [];
const SOON = (window.CATALOG_SOON || []).filter(c => !READY.some(r => r.id === c.id));
const ALL_PRICE = 24900, ALL_LIST = 39900; /* 통합 패스 가격(임시) */
const won = n => n.toLocaleString('ko-KR') + '원';

/* 현재 자격증에 맞춰 바뀌는 값들 */
let C, Q, OX, SK, SUBJ, SUBJ_FULL, SUBJ_SHORT, PASS, PDF_LINK;
function useCert(id) {
  C = READY.find(c => c.id === id) || READY[0];
  Q = C.questions; OX = C.ox || [];
  SK = Object.keys(C.subjects).map(Number);
  SUBJ = { 0: '전체' }; SUBJ_FULL = {}; SUBJ_SHORT = {};
  SK.forEach(k => { SUBJ[k] = k + '과목'; SUBJ_FULL[k] = C.subjects[k].full; SUBJ_SHORT[k] = C.subjects[k].short; });
  PASS = C.pass; PDF_LINK = C.pdf || '#';
  G.cur = C.id;
  if (!G.data[C.id]) G.data[C.id] = blankCert();
  S = G.data[C.id];
  SK.forEach(k => { if (!S.subj[k]) S.subj[k] = { t: 0, c: 0 }; });
}

/* ===== 상태: G(공통) + S(현재 자격증) ===== */
const KEY = 'oreumpass_v3';
const blankCert = () => ({ wrong: [], wrongOx: [], star: [], seen: [], solved: 0, correct: 0, subj: {}, days: {}, hist: [], goal: 10, exam: '', dox: null, goalDone: '' });
const blankG = () => ({ cur: '', name: '', installHidden: false, passAll: false, passCerts: [], data: {} });
let G = blankG(), S = null;
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) G = Object.assign(blankG(), v); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} }
const isPro = () => G.passAll || G.passCerts.includes(C.id);

const $app = document.getElementById('app');
let run = null, tab = 'home', wnTab = 'cbt', afterPay = null, timer = null;

/* ===== 유틸 ===== */
const pad2 = n => String(n).padStart(2, '0');
function dkey(d = new Date()) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today() { return S.days[dkey()] || 0; }
function streakOf(days) { let n = 0, d = new Date(); if (!days[dkey(d)]) d.setDate(d.getDate() - 1); while (days[dkey(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function streak() { return streakOf(S.days); }
function dday(ex) { ex = ex === undefined ? S.exam : ex; if (!ex) return null; return Math.round((new Date(ex + 'T00:00:00') - new Date(dkey() + 'T00:00:00')) / 864e5); }
function acc(s) { const o = S.subj[s]; return o && o.t ? Math.round(o.c / o.t * 100) : null; }
function weakest() { const t = SK.map(s => ({ s, a: acc(s) })).filter(x => x.a !== null); return t.length ? t.reduce((m, x) => x.a < m.a ? x : m) : null; }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmt(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function shuffle(a) { return a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]); }
function pool(s) { return Q.map((q, i) => Object.assign({ id: i }, q)).filter(q => !s || q.s === s); }
function record(s, ok, qid) {
  S.solved++; if (ok) S.correct++; S.subj[s].t++; if (ok) S.subj[s].c++;
  const k = dkey(); S.days[k] = (S.days[k] || 0) + 1;
  if (qid !== undefined && !S.seen.includes(qid)) S.seen.push(qid);
  if (S.days[k] >= S.goal && S.goalDone !== k) { S.goalDone = k; setTimeout(celebrate, 350); }
}
function celebrate() { const c = document.createElement('div'); c.className = 'confetti'; const col = ['#3182F6', '#FFB800', '#F04452', '#00C471', '#FF8A00']; for (let i = 0; i < 60; i++) { const e = document.createElement('i'); e.style.left = Math.random() * 100 + '%'; e.style.background = col[i % 5]; e.style.animationDelay = Math.random() * .5 + 's'; e.style.animationDuration = 1.2 + Math.random() + 's'; c.appendChild(e); } document.body.appendChild(c); setTimeout(() => c.remove(), 2800); toast('오늘 목표 ' + S.goal + '문제 달성! 🎉'); }
function badge(c, size) { return certIcon(c, size || 44); }

function bottom(html) { document.querySelectorAll('.bottom,.tabbar').forEach(e => e.remove()); if (!html) return; const b = document.createElement('div'); b.className = 'bottom'; b.innerHTML = '<div class="wrap"><div class="side-logo"><img src="icon-192.png" alt="">' + WORDMARK + '</div>' + html + '</div>'; document.body.appendChild(b); }
const TI = { home: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.3 2.6a1 1 0 011.4 0l8.5 8a1 1 0 01-.7 1.7H19v8a1.7 1.7 0 01-1.7 1.7h-3.1v-5.5h-4.4V22H6.7A1.7 1.7 0 015 20.3v-8H3.5a1 1 0 01-.7-1.7z"/></svg>',
  study: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4.5" height="9" rx="1.5"/><rect x="9.75" y="7" width="4.5" height="14" rx="1.5"/><rect x="16.5" y="3" width="4.5" height="18" rx="1.5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2zm3 5a1 1 0 000 2h8a1 1 0 100-2zm0 4a1 1 0 000 2h5a1 1 0 100-2z"/></svg>',
  my: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 20.5c0-4 3.8-7 8.5-7s8.5 3 8.5 7a1 1 0 01-1 1h-15a1 1 0 01-1-1z"/></svg>' };
function tabbar() { document.querySelectorAll('.bottom,.tabbar').forEach(e => e.remove()); const b = document.createElement('nav'); b.className = 'tabbar'; b.innerHTML = '<div class="wrap"><div class="side-logo"><img src="icon-192.png" alt="">' + WORDMARK + '</div>' + [['home', '홈'], ['study', '기록'], ['note', '복습노트'], ['my', '내 정보']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')">${TI[k]}${l}</button>`).join('') + '</div>'; document.body.appendChild(b); }
function topBar(title, right, backFn) { return `<div class="top"><button class="back" onclick="${backFn || 'go(tab)'}" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#191F28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="ttl">${title}</div><div class="right" id="tr">${right || ''}</div></div>`; }
function go(t) { stopTimer(); run = null; $app.classList.remove('wide'); if (t === 'note' && !isPro()) { paywall('wrong'); return; } tab = t; window.scrollTo(0, 0); ({ home, study: studyTab, note: wrongNote, my: myTab })[t](); }
const lockTag = () => `<span class="tag pro">${IC.lock()} PRO</span>`;
function brandBar() { return `<div class="top"><div class="logo"><img src="icon-192.png" alt="" onerror="this.remove()">${WORDMARK}</div><button class="switch" onclick="certPicker()">${badge(C, 22)}<span>${esc(C.short)}</span><svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`; }

/* ===== 자격증 선택 (첫 화면) ===== */
function certPicker(first) { if (!first) markNav();
  stopTimer(); run = null; window.scrollTo(0, 0); $app.classList.add('wide');
  const totalQ = READY.reduce((n, c) => n + c.questions.length, 0);
  const big = c => { const d = G.data[c.id], pro = G.passAll || G.passCerts.includes(c.id), dd = d ? dday(d.exam) : null, seen = d ? d.seen.length : 0, pct = Math.round(seen / c.questions.length * 100);
    const subs = Object.entries(c.subjects).map(([k, v]) => `<span><i>${k}</i>${esc(v.short)}</span>`).join('');
    const tag = pro ? '<span class="tag on">PRO</span>' : dd !== null && dd >= 0 ? `<span class="tag free">D-${dd}</span>` : '<span class="rc-open">무료 오픈</span>';
    return `<button class="rc ${G.cur === c.id && !first ? 'on' : ''}" style="--cc:${c.accent || c.color}" onclick="pickCert('${c.id}')">
      <svg class="rc-deco" viewBox="0 0 220 120" aria-hidden="true"><path d="M0 104 L40 86 L70 94 L110 60 L140 70 L180 34 L220 14" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="rc-top">${badge(c, 56)}<div class="grow"><div class="rc-cat">${esc(c.info.org)} · ${esc(c.desc || c.cat)}</div><div class="rc-name">${esc(c.name)}</div></div>${tag}</div>
      <div class="rc-subs">${subs}</div>
      <div class="rc-meta"><span><b>${c.info.count}</b>문항 · <b>${c.info.minutes}</b>분</span><span>${esc(c.info.format)}</span><span>평균 <b>${c.pass.total}</b> · 과락 <b>${c.pass.sub}</b></span><span>${esc(c.info.eligibility)}</span></div>
      ${seen ? `<div class="rc-bar"><i style="width:${pct}%"></i></div>` : ''}
      <div class="rc-foot"><span class="rc-n">자체 제작 <b>${c.questions.length}</b>문항 · 해설 포함</span><span class="rc-cta">${seen ? `${seen}문제 풀었어요 · 이어서 →` : '무료로 시작하기 →'}</span></div>
    </button>`; };
  const tile = c => `<button class="sc" onclick="toast('${esc(c.name)} 문제를 열심히 만들고 있어요')">${badge(c, 48)}<div class="grow"><div class="sc-top"><span class="sc-name">${esc(c.name)}</span><span class="sc-tag">준비 중</span></div><div class="sc-d">${esc(c.org || c.cat)}${c.desc ? ' · ' + esc(c.desc) : ''}</div>${c.meta ? `<div class="sc-m">${c.meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}</div></button>`;
  $app.innerHTML = `<div class="top ftop"><div class="logo"><img src="icon-192.png" alt="" onerror="this.remove()">${WORDMARK}</div>${first ? '' : `<button class="back-x" onclick="go(tab)">닫기</button>`}</div>
  <div class="pad fwrap">
    <section class="fhero">
      <div class="fh-art"><img src="icon-512.png" alt="" onerror="this.remove()"></div>
      <div class="fh-k">자격증 CBT · 더오를패스</div>
      <h1>한 문제씩 <em>더 오를</em><br>자격증 합격까지</h1>
      <p>실제 시험처럼 풀고, 틀린 문제만 골라 다시 올라가요.</p>
      <div class="fh-stats"><div><b>${READY.length}</b><span>열린 자격증</span></div><div><b>${totalQ}</b><span>문항</span></div><div><b>100%</b><span>해설 포함</span></div></div>
      <ul class="fh-pt"><li>${IC.exam()}<span>실전 시간 그대로 모의고사</span></li><li>${IC.target()}<span>합격선·과락선 기준 실력 진단</span></li><li>${IC.note()}<span>틀린 문제만 모으는 복습노트</span></li></ul>
    </section>
    <section class="flist">
      <div class="fl-h">${first ? '어떤 자격증을 준비하나요?' : '공부할 자격증을 골라 주세요'}</div>
      ${READY.map(big).join('')}
      ${SOON.length ? `<div class="fl-h sm">곧 열려요 <span>${SOON.length}개</span></div><div class="sgrid2">${SOON.map(tile).join('')}</div>` : ''}
      ${G.passAll ? '' : `<button class="allpass" onclick="paywall('all')"><div class="ap-ic">${IC.trophy()}</div><div class="grow"><div class="t">더오를패스 ALL</div><div class="d">모든 자격증 PRO · 새 자격증도 자동 포함</div></div><span class="go">${won(ALL_PRICE)}</span></button>`}
      <div class="foot">문제는 출제 논점을 바탕으로 더오를이 직접 만든 문항이에요.</div>
    </section>
  </div>`;
  bottom('');
}
function pickCert(id) { useCert(id); save(); tab = 'home'; $app.classList.remove('wide'); go('home'); toast(C.name + '(으)로 바꿨어요'); }

/* ===== 홈 ===== */

function passCard() {
  const rate = S.solved ? Math.round(S.correct / S.solved * 100) : null, T = PASS.total, M = PASS.sub;
  const sub = SK.map(s => ({ s, a: acc(s) })), cut = sub.some(x => x.a !== null && x.a < M);
  const st = rate === null ? ['아직 몰라요', 'var(--gray)', '문제를 풀면 합격 가능성을 알려 드려요', 'var(--bg)'] : rate >= T && !cut ? ['합격권', 'var(--green)', '지금 실력이면 합격선을 넘어요', 'var(--green-soft)'] : cut ? ['과락 주의', 'var(--red)', M + '% 미만 과목이 있어요', 'var(--red-soft)'] : ['조금 더', 'var(--orange)', `합격선까지 ${T - rate}%p 남았어요`, 'var(--orange-soft)'];
  const wk = weakest();
  return `<div class="card pass">
    <div style="display:flex;align-items:flex-end;justify-content:space-between"><div><div class="lbl">현재 정답률</div><div class="val" style="font-size:30px">${rate === null ? '-' : rate}<small>%</small></div></div><div style="text-align:right"><span class="tag" style="background:${st[3]};color:${st[1]};font-size:13px">${st[0]}</span><div style="font-size:13px;color:var(--gray);margin-top:6px">${st[2]}</div></div></div>
    <div class="gauge"><i style="width:${rate || 0}%;background:${st[1]}"></i><span class="mk" style="left:${T}%"><em>합격 ${T}</em></span></div>
    ${sub.map(({ s, a }) => `<div class="bar"><span class="nm">${SUBJ[s]} <span style="color:var(--gray);font-weight:500">${SUBJ_SHORT[s]}</span></span><span class="tr cutline" style="--cut:${M}%"><i style="width:${a || 0}%;${a !== null && a < M ? 'background:var(--red)' : a !== null && a < T ? 'background:var(--orange)' : ''}"></i></span><span class="v">${a === null ? '-' : a + '%'}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-top:2px"><span>┆ 표시는 과락선 ${M}%</span>${wk && wk.a < 100 ? `<a style="color:var(--blue);font-weight:700;cursor:pointer;font-size:13px" onclick="${isPro() ? 'startWeak()' : "paywall('weak')"}">${SUBJ[wk.s]} 약점 집중 ›</a>` : ''}</div>
  </div>`;
}

/* 오늘의 OX */
function doxIdx() { const k = dkey() + C.id; return [...k].reduce((a, c) => a + c.charCodeAt(0), 0) % OX.length; }
function dailyOx() { const idx = doxIdx(), x = OX[idx], done = S.dox && S.dox.d === dkey(), ok = done && S.dox.v === x.a;
  return `<div class="card dox"><div class="hd"><span class="tag free">${SUBJ[x.s]}</span><span style="font-size:13px;color:var(--gray);font-weight:600">매일 새 문제</span></div>
  <div class="dst">${esc(x.t)}</div>
  <div class="bt"><button class="o ${done && S.dox.v === true ? 'hit' : ''}" ${done ? 'disabled' : ''} onclick="doxAns(true)">O</button><button class="x ${done && S.dox.v === false ? 'hit' : ''}" ${done ? 'disabled' : ''} onclick="doxAns(false)">X</button></div>
  ${done ? `<div class="res" style="background:${ok ? 'var(--green-soft)' : 'var(--red-soft)'}"><b style="color:${ok ? 'var(--green)' : 'var(--red)'}">${ok ? '정답이에요!' : '아쉬워요 · 정답 ' + (x.a ? 'O' : 'X')}</b> ${esc(x.e)}</div>
   ${isPro() ? `<button class="lock" style="background:var(--blue-soft);color:var(--blue)" onclick="startOx(0)"><span>OX 선지 ${OX.length}개 이어서 풀기</span><span>›</span></button>` : `<button class="lock" onclick="paywall('ox')"><span>${IC.lock()} OX 선지 ${OX.length}개 더 풀어보기</span><span>›</span></button>`}` : ''}</div>`; }
function doxAns(v) { const idx = doxIdx(), x = OX[idx]; S.dox = { d: dkey(), v }; record(x.s, v === x.a); if (v !== x.a && !S.wrongOx.includes(idx)) S.wrongOx.push(idx); save(); home(); }

/* ===== 풀이 진입 ===== */
function startQuick() { const all = pool(0), un = shuffle(all.filter(q => !S.seen.includes(q.id))), sn = shuffle(all.filter(q => S.seen.includes(q.id))); startQuiz(un.concat(sn).slice(0, 10), '빠른 10문제'); }
function startWeak() { const w = weakest(); if (!w) { toast('먼저 문제를 풀어 실력을 확인해 볼게요'); startQuick(); return; } const ws = pool(w.s); const wr = ws.filter(q => S.wrong.includes(q.id)); startQuiz(wr.concat(shuffle(ws.filter(q => !S.wrong.includes(q.id)))), '약점 집중 · ' + SUBJ[w.s]); }
function subjectSheet() { unitPage(); }
function subjectSheetOld() { openSheet(`<h3>어떤 과목을 풀까요?</h3><div class="p">문제마다 바로 정답과 해설을 보여 드려요</div>
  ${SK.map(s => { const a = acc(s); return `<button class="pick" onclick="closeSheet();startQuiz(pool(${s}),'${SUBJ[s]} 풀기')"><div class="grow"><div class="t">${SUBJ[s]} · ${esc(SUBJ_FULL[s])}</div><div class="d">${pool(s).length}문항${a !== null ? ' · 정답률 ' + a + '%' : ''}</div></div><span class="chev">›</span></button>`; }).join('')}
  <button class="pick" onclick="closeSheet();startQuiz(pool(0),'전 과목 풀기')"><div class="grow"><div class="t">전 과목 순서대로</div><div class="d">${Q.length}문항</div></div><span class="chev">›</span></button>`); }

/* ===== 연습 모드: 문제 + 해설 2단 구조 ===== */
function startQuiz(items, label, mode, at) { if (!items.length) { toast('풀 문제가 없어요'); return; }
  run = { mode: mode || 'explain', items, i: at || 0, st: items.map(() => ({ pick: null, done: false })), score: 0, wrongIds: [], start: Date.now(), label, retry: label === '오답 다시 풀기', memo: false };
  stopTimer(); drawQ(); }
function starBtn(id) { return `<button class="sb" onclick="toggleStar(${id})" aria-label="별표">${IC.starLine(S.star.includes(id))}</button>`; }
function toggleStar(id) { const on = S.star.includes(id); S.star = on ? S.star.filter(x => x !== id) : S.star.concat(id); save(); toast(on ? '북마크를 뺐어요' : '북마크에 담았어요 ⭐'); run && run.mock ? drawMock() : drawQ(); }
const NUM = '①②③④';
function explainHTML(q, pick) {
  const answered = pick !== null && pick !== undefined, ok = pick === q.a, qs = (S.qstat || {})[q.id];
  let h = `<div class="rx-band ${!answered ? '' : ok ? 'ok' : 'no'}"><div class="rx-ic">${!answered ? IC.medal() : ok ? IC.trophy() : IC.climb()}</div><div><div class="rx-t">${!answered ? '정답' : ok ? '맞혔어요!' : '한 번 더 오르면 돼요'}</div><div class="rx-s">정답 ${NUM[q.a]} ${esc(q.o[q.a])}</div></div></div>`;
  if (q.c) h += `<div class="rx-blk"><div class="rx-lbl"><i>01</i>한 줄 개념</div><p>${esc(q.c)}</p></div>`;
  h += `<div class="rx-blk"><div class="rx-lbl"><i>${q.c ? '02' : '01'}</i>왜 정답이 ${NUM[q.a]}일까</div><p>${esc(q.e)}</p></div>`;
  if (q.w) h += `<div class="rx-blk"><div class="rx-lbl"><i>03</i>보기별 함정 체크</div><table class="rx-tb">${q.o.map((o, k) => `<tr class="${k === q.a ? 'c' : ''} ${k === pick && k !== q.a ? 'm' : ''}"><td class="k">${NUM[k]}</td><td class="j">${k === q.a ? '<b class="o">O</b>' : '<b class="x">X</b>'}</td><td>${k === q.a ? '정답 보기예요.' : esc(q.w[k] || '')}${k === pick && k !== q.a ? ' <span class="pk">내 선택</span>' : ''}</td></tr>`).join('')}</table></div>`;
  h += `<a class="ref" href="${PDF_LINK}" target="_blank" rel="noopener">${IC.book()}<span>${esc(C.short)} 정리본 ${SUBJ[q.s]} ‘${esc(SUBJ_SHORT[q.s])}’ 펼쳐 보기 ›</span></a>`;
  if (qs && qs.t) h += `<div class="xp-me">나의 풀이 ${qs.t}회 · 오답 ${qs.w}회</div>`;
  return h;
}
function drawQ() { markNav();
  const r = run, q = r.items[r.i], st = r.st[r.i], n = r.items.length; window.scrollTo(0, 0);

  const memo = (S.memo || {})[q.id] || '', solved = r.st.filter(x => x.done || (M === 'exam' && x.pick !== null)).length;
  $app.classList.add('wide');
  $app.innerHTML = `<div class="top qtop"><button class="back" onclick="quitQuiz()" aria-label="나가기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#191F28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    <div class="qnav"><button class="ar" ${r.i === 0 ? 'disabled' : ''} onclick="goQ(${r.i - 1})" aria-label="이전 문제">‹</button><button class="pg" onclick="jumpSheet()"><svg viewBox="0 0 24 24" width="15" height="15"><rect x="3" y="3" width="7" height="7" rx="2" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="2" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="2" fill="currentColor"/><rect x="14" y="14" width="7" height="7" rx="2" fill="currentColor" opacity=".4"/></svg>${r.i + 1}<em>/${n}</em></button><button class="ar" onclick="${r.i + 1 < n ? `goQ(${r.i + 1})` : 'finishQuiz()'}" aria-label="다음 문제">›</button></div></div>
  <div class="pad"><div class="prog"><i style="width:${solved / n * 100}%"></i></div>
  <div class="qwrap">
    <div class="qcard">
      <div class="qhead"><span class="qno">${r.i + 1}</span><span class="tagS">${SUBJ[q.s]} · ${esc(SUBJ_SHORT[q.s])}</span>${q.lv ? `<span class="tagL">난이도 ${q.lv}</span>` : ''}${q.rev ? '<span class="tagR">2026 개정</span>' : ''}
        <div class="tools"><button title="북마크" onclick="toggleStar(${q.id})">${IC.starLine(S.star.includes(q.id))}</button><button title="내 노트" onclick="run.memo=!run.memo;drawQ()" class="${memo ? 'has' : ''}"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 20h4l10-10-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button><button title="펜 필기" class="${run.pen ? 'has' : ''}" onclick="togglePen()"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 21c3-1 5-3 6-5M14.5 4.5l5 5L10 19l-5.5.5L5 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></button><button title="문제 제보" onclick="reportSheet(${q.id})"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3l9 16H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 16.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div></div>

function goQ(i) { run.i = Math.max(0, Math.min(run.items.length - 1, i)); run.memo = false; drawQ(); }

  S.qstat = S.qstat || {}; const qs = S.qstat[q.id] = S.qstat[q.id] || { t: 0, w: 0 }; qs.t++; if (!ok) qs.w++;

  bottom(`<button class="btn ghost sm" ${r.i === 0 ? 'disabled' : ''} onclick="run.i--;drawMock()">이전</button>` + (r.i + 1 < r.items.length ? `<button class="btn ghost" onclick="run.i++;drawMock()">다음</button>` : '') + `<button class="btn" onclick="submitMock()">제출하기</button>`); }
let submitArm = false;

let unitSel = [];
function unitsOf() { const m = new Map(); pool(0).forEach(q => { const k = q.s + '|' + (q.sec || ''); if (!m.has(k)) m.set(k, { k, s: q.s, name: q.sec || SUBJ_SHORT[q.s] + ' 종합', items: [] }); m.get(k).items.push(q); }); return [...m.values()].sort((a, b) => a.s - b.s || (a.name.includes('종합') ? 1 : -1)); }
function unitPage() { markNav();

/* 세트별 */
function hashN(n) { let x = (n + 1) * 2654435761 % 4294967296; x ^= x >>> 13; return x; }
function setsOf() { const ord = pool(0).sort((a, b) => hashN(a.id) - hashN(b.id)); const out = []; for (let i = 0; i < ord.length; i += SET_N) out.push(ord.slice(i, i + SET_N)); if (out.length > 1 && out[out.length - 1].length < SET_N / 2) { const last = out.pop(); out[out.length - 1] = out[out.length - 1].concat(last); } return out; }
function setPage() { markNav();
  window.scrollTo(0, 0); $app.classList.remove('wide'); const sets = setsOf(), best = S.setBest || {};

    ${sets.map((it, i) => { const n = i + 1, b = best[n], seen = it.filter(q => S.seen.includes(q.id)).length, sub = SK.map(s => it.filter(q => q.s == s).length);
      return `<button class="setc" onclick="modeSheet(setsOf()[${i}],'세트 ${n}',{setNo:${n}})"><div class="sno"><small>SET</small>${pad2(n)}</div><div class="grow"><div class="t">실전 세트 ${n}</div><div class="d">${it.length}문항 · ${sub.map((c, k) => `${SK[k]}과목 ${c}`).join(' · ')}</div><div class="ub"><i style="width:${seen / it.length * 100}%"></i></div></div><div class="sbest ${b === undefined ? '' : b >= PASS.total ? 'ok' : 'no'}">${b === undefined ? '<em>미응시</em>' : `<b>${b}</b><em>최고점</em>`}</div></button>`; }).join('')}

  </div>`; tabbar();
}

/* 펜 필기 */
function togglePen() { run.pen = !run.pen; drawQ(); }
function mountPen() {
  const card = document.querySelector('.qcard'); if (!card || card.querySelector('.inkc')) return;
  card.style.position = 'relative';
  const cv = document.createElement('canvas'); cv.className = 'inkc'; const bar = document.createElement('div'); bar.className = 'inkbar';
  bar.innerHTML = `<span>펜 필기 중</span>${['#F04452', '#3182F6', '#191F28'].map((c, i) => `<button class="sw ${i === 0 ? 'on' : ''}" style="background:${c}" data-c="${c}"></button>`).join('')}<button class="tx" data-a="clr">지우기</button><button class="tx" data-a="end">닫기</button>`;
  card.appendChild(cv); card.appendChild(bar);
  const dpr = window.devicePixelRatio || 1, W = card.clientWidth, H = card.clientHeight; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 2.6; g.strokeStyle = '#F04452';
  let on = false;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { on = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); g.beginPath(); g.moveTo(x, y); };
  cv.onpointermove = e => { if (!on) return; const [x, y] = pt(e); g.lineTo(x, y); g.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => on = false;
  bar.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.c) { g.strokeStyle = b.dataset.c; bar.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); } if (b.dataset.a === 'clr') g.clearRect(0, 0, W, H); if (b.dataset.a === 'end') togglePen(); };
}

    ['틀린 문제나 바뀐 법령을 발견했어요', `문제 화면 오른쪽 위 ⚠ 버튼으로 제보 내용을 복사해서 보내 주세요. 확인 후 고쳐서 반영해요.`],
    ['펜 필기는 어떻게 써요?', `문제 화면의 펜 버튼을 누르면 문제 위에 직접 밑줄을 긋거나 계산할 수 있어요. 색을 바꾸거나 지울 수 있고, 다른 문제로 넘어가면 지워져요.`],
    ['환불은 어떻게 되나요?', `지금은 시제품이라 실제 결제가 일어나지 않아요. 정식 출시 때 환불 규정을 결제 화면과 이 페이지에 함께 안내할게요.`]
  ];
  $app.innerHTML = topBar('이용 안내') + `<div class="pad upage"><div class="lead">${esc(C.name)} · 자주 묻는 질문</div>
    ${F.map(([q, a], i) => `<div class="faq ${i === 0 ? 'open' : ''}" onclick="this.classList.toggle('open')"><div class="fq"><span class="qm">Q</span><span class="grow">${q}</span><span class="ar">⌄</span></div><div class="fa">${a}</div></div>`).join('')}
    <div class="foot">${policyLinks()}</div></div>`; tabbar();
}
function policyLinks() { return `<div class="pol"><a onclick="toast('정식 출시 전에 공개돼요')">이용약관</a><a onclick="toast('정식 출시 전에 공개돼요')">개인정보처리방침</a><a onclick="toast('정식 출시 전에 공개돼요')">환불 규정</a><a onclick="faqPage()">이용 안내</a></div>`; }


/* ===== 기기 간 기록 옮기기 (서버 없이 코드로) ===== */
function exportCode() { const j = JSON.stringify(G); return 'OREUM1:' + btoa(unescape(encodeURIComponent(j))); }
function syncSheet() {
  openSheet(`<div class="hi">${IC.phone()}</div><h3>다른 기기로 기록 옮기기</h3><div class="p">아이폰 ↔ 안드로이드 ↔ PC, 사파리 ↔ 홈 화면 앱 사이에서 풀이 기록·오답노트·북마크를 그대로 옮겨요</div>
    <div class="feat"><span class="ck">1</span><span>지금 기기에서 <b>내 기록 코드 복사</b>를 눌러요</span></div>
    <div class="feat"><span class="ck">2</span><span>카톡 나에게 보내기·메모 앱으로 새 기기에 보내요</span></div>
    <div class="feat"><span class="ck">3</span><span>새 기기에서 <b>기록 코드 붙여넣기</b>에 넣어요</span></div>
    <button class="btn" style="width:100%;margin:12px 0 10px" onclick="copyText(exportCode(),'기록 코드를 복사했어요')">내 기록 코드 복사</button>
    <textarea id="imp" class="field memo" style="height:84px;padding:12px" placeholder="여기에 기록 코드를 붙여넣어요 (OREUM1:…)"></textarea>
    <button class="btn ghost" style="width:100%" onclick="importCode()">기록 코드 붙여넣기</button>
    <div class="note">붙여넣으면 이 기기의 기록이 코드 속 기록으로 바뀌어요. 로그인 기능이 생기면 자동으로 이어지게 할게요.</div>`);
}
let impArm = false;
function importCode() {
  const v = (document.getElementById('imp').value || '').trim();
  try { if (!v.startsWith('OREUM1:')) throw 0; const g = JSON.parse(decodeURIComponent(escape(atob(v.slice(7))))); if (!g || typeof g !== 'object' || !g.data) throw 0;
    if (!impArm) { impArm = true; toast('한 번 더 누르면 이 기기 기록이 바뀌어요'); setTimeout(() => impArm = false, 2500); return; }
    impArm = false; G = Object.assign(blankG(), g); useCert(G.cur && READY.some(c => c.id === G.cur) ? G.cur : READY[0].id); save(); closeSheet(); toast('기록을 옮겨 왔어요'); go('home');
  } catch (e) { toast('기록 코드가 올바르지 않아요'); }
}

/* ===== 안드로이드 뒤로가기 · 아이폰 스와이프 뒤로가기 ===== */
let navDepth = false;
function markNav() { try { if (!navDepth) { history.pushState({ op: 1 }, ''); navDepth = true; } } catch (e) {} }
window.addEventListener('popstate', () => {
  navDepth = false;
  const sh = document.getElementById('sheet');
  if (sh && sh.classList.contains('show')) { closeSheet(); if (onSub()) markNav(); return; }
  if (run || onSub()) { stopTimer(); run = null; quitArm = false; $app.classList.remove('wide'); go(tab === 'home' || !tab ? 'home' : tab); return; }
  try { history.back(); } catch (e) {}
});
function onSub() { return !document.querySelector('.tabbar') || !!document.querySelector('.top .back'); }
/* ===== 시트 ===== */
function openSheet(html) { markNav(); const sh = document.getElementById('sheet'); sh.innerHTML = '<div class="grab"></div>' + html; document.getElementById('dim').classList.add('show'); sh.classList.add('show'); }
function closeSheet() { document.getElementById('dim').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }
document.getElementById('dim').onclick = closeSheet;
function examSheet() { openSheet(`<div class="hi">${IC.calendar()}</div><h3>${esc(C.short)} 시험일이 언제예요?</h3><div class="p">D-day와 하루에 풀 문제 수를 계산해 드려요</div>
  <input class="field" type="date" id="exam" value="${S.exam}" min="${dkey()}"><button class="btn" style="width:100%" onclick="S.exam=document.getElementById('exam').value;save();closeSheet();go(tab)">저장하기</button>`); }
function goalSheet() { openSheet(`<div class="hi">${IC.goal()}</div><h3>하루에 몇 문제 풀까요?</h3><div class="p">부담 없는 목표가 오래 가요</div>
  <div class="goals">${[5, 10, 20, 30].map(n => `<button class="${S.goal === n ? 'on' : ''}" onclick="S.goal=${n};save();closeSheet();go(tab)">${n}문제</button>`).join('')}</div>`); }
function nameSheet() { openSheet(`<h3>뭐라고 불러 드릴까요?</h3><div class="p">홈 화면 인사말에 표시돼요</div>
  <input class="field" id="nm" maxlength="10" placeholder="이름 또는 닉네임" value="${esc(G.name)}"><button class="btn" style="width:100%" onclick="G.name=document.getElementById('nm').value.trim();save();closeSheet();go(tab)">저장하기</button>`); }

/* ===== 홈 화면에 추가 ===== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('appinstalled', () => { G.installHidden = true; save(); toast('홈 화면에 추가됐어요'); });
function isStandalone() { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
function showInstall() { return !isStandalone() && !G.installHidden; }
function installGuide() { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; }); return; }
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document), inApp = /Instagram|FBAN|FBAV|KAKAOTALK|NAVER/.test(ua);
  const step = (n, t) => `<div class="feat"><span class="ck">${n}</span><span>${t}</span></div>`; let body;
  if (inApp) body = step(1, '오른쪽 위 <b>⋯ 메뉴</b>를 눌러요') + step(2, '<b>다른 브라우저로 열기</b>를 눌러요 (아이폰은 Safari, 안드로이드는 Chrome)') + step(3, '열린 화면에서 이 버튼을 한 번 더 눌러요');
  else if (ios && /CriOS|FxiOS|EdgiOS/.test(ua)) body = step(1, '주소창 오른쪽 <b>공유 버튼(□↑)</b>을 눌러요') + step(2, '<b>홈 화면에 추가</b>를 눌러요 (안 보이면 Safari로 열어 주세요)') + step(3, '오른쪽 위 <b>추가</b>를 누르면 끝!');
  else if (/SamsungBrowser/.test(ua)) body = step(1, '아래쪽 <b>≡ 메뉴</b>를 눌러요') + step(2, '<b>현재 페이지 추가 → 홈 화면</b>을 눌러요') + step(3, '<b>추가</b>를 누르면 끝!');
  else if (ios) body = step(1, 'Safari 아래쪽 <b>공유 버튼(□↑)</b>을 눌러요') + step(2, '목록을 내려서 <b>홈 화면에 추가</b>를 눌러요') + step(3, '오른쪽 위 <b>추가</b>를 누르면 끝!');
  else body = step(1, 'Chrome 오른쪽 위 <b>⋮ 메뉴</b>를 눌러요') + step(2, '<b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 눌러요') + step(3, '<b>설치</b>를 누르면 끝!');
  openSheet(`<div class="hi"><img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px;box-shadow:0 6px 16px rgba(11,26,61,.3)" onerror="this.remove()"></div><h3>홈 화면에 추가하면<br>앱처럼 바로 열려요</h3><div class="p">${inApp ? '인스타·카톡 안에서는 추가가 안 돼서, 브라우저로 먼저 열어야 해요' : '링크 찾을 필요 없이 아이콘 한 번으로 문제 풀기'}</div>${body}<div style="height:14px"></div><button class="btn" style="width:100%" onclick="closeSheet()">알겠어요</button>`); }

/* ===== 결제: 자격증별 PRO + 통합 패스 ===== */
let payPick = 'all';
function paywall(kind) { afterPay = kind; payPick = kind === 'all' ? 'all' : (G.passCerts.includes(C.id) ? 'all' : 'one'); drawPay(); }
function drawPay() { const one = kind => `<button class="plan ${payPick === kind ? 'on' : ''}" onclick="payPick='${kind}';drawPay()">`;
  openSheet(`<h3>틀린 문제만 골라서<br>자격증 합격까지 빠르게</h3><div class="p">더오를패스 PRO로 합격선까지 약점을 집중 복습하세요</div>
    <div class="feat"><span class="fi">${IC.note()}</span><span>오답노트 자동 정리<small>틀린 문제만 다시 풀고, 맞히면 빠져요</small></span></div>
    <div class="feat"><span class="fi">${IC.ox()}</span><span>OX 선지 퀴즈<small>선지를 쪼개서 개념을 확실하게</small></span></div>
    <div class="feat"><span class="fi">${IC.target()}</span><span>약점 과목 집중 · 별표 문제<small>정답률 낮은 과목부터 자동으로</small></span></div>
    <div style="height:10px"></div>
    ${G.passCerts.includes(C.id) ? '' : `${one('one')}<span class="rd"></span><div class="grow"><div class="t">${esc(C.short)} PRO</div><div class="d">${esc(C.name)} 시험일까지</div></div><div class="pr">${won(C.price)}</div></button>`}
    ${one('all')}<span class="rd"></span><div class="grow"><div class="t">더오를패스 ALL <span class="best">추천</span></div><div class="d">모든 자격증 PRO · 새 자격증도 자동 포함</div></div><div class="pr"><s>${won(ALL_LIST)}</s>${won(ALL_PRICE)}</div></button>
    <button class="btn" style="width:100%;margin-top:6px" onclick="buy()">${payPick === 'all' ? won(ALL_PRICE) : won(C.price)} 결제하기</button>
    <div class="note">시제품이라 실제 결제는 되지 않고 바로 잠금이 풀려요</div>`); }
function buy() { if (payPick === 'all') G.passAll = true; else if (!G.passCerts.includes(C.id)) G.passCerts.push(C.id); save(); closeSheet(); toast((payPick === 'all' ? '더오를패스 ALL' : C.short + ' PRO') + '가 열렸어요 🎉');
  setTimeout(() => { if (afterPay === 'ox') startOx(0); else if (afterPay === 'weak') startWeak(); else if (afterPay === 'all') go(tab); else { tab = 'note'; go('note'); } }, 300); }

/* ===== 시작 ===== */
if (!READY.length) { document.getElementById('app').innerHTML = '<div class="empty">자격증 데이터가 없어요</div>'; }
else if (!G.cur || !READY.some(c => c.id === G.cur)) { useCert(READY[0].id); G.cur = ''; certPicker(true); }
else { useCert(G.cur); go('home'); }

/* ===== 앱 저장(서비스 워커): 내 주소(https)에 올렸을 때만 동작 ===== */
try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

</script>
</body>
</html>
